<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VtwinsTCG</title>
<meta name="theme-color" content="#2b3fd9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VtwinsTCG">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { background: var(--bg); color-scheme: light; }
:root { color-scheme: light; }

/* Layout: mobile app. Header + totals, sport filter strip, 5:7 card grid, floating add button opening a bottom sheet. */
:root {
  --bg: #eceef3;
  --surface: #ffffff;
  --surface-2: #f4f5f9;
  --ink: #12151d;
  --ink-2: #5a6071;
  --line: #d8dbe5;
  --accent: #2b3fd9;
  --accent-ink: #ffffff;
  --danger: #c4283c;
  --ok: #1f7a4d;
  --foot: #1f7a4d;
  --bask: #d9611a;
  --ufc: #c4283c;
  --tennis: #8a8f0a;
  --other: #5a6071;
  --shadow: 0 1px 2px rgba(18,21,29,.08), 0 6px 18px rgba(18,21,29,.06);
  --font-display: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1118; --surface: #171b25; --surface-2: #1f2430; --ink: #eef0f6; --ink-2: #9aa1b4;
    --line: #2a3040; --accent: #8c9bff; --accent-ink: #0e1118; --danger: #ff6b7d; --ok: #55c98d;
    --foot: #55c98d; --bask: #ff9b5c; --ufc: #ff6b7d; --tennis: #d4d84a; --other: #9aa1b4;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1118; --surface: #171b25; --surface-2: #1f2430; --ink: #eef0f6; --ink-2: #9aa1b4;
  --line: #2a3040; --accent: #8c9bff; --accent-ink: #0e1118; --danger: #ff6b7d; --ok: #55c98d;
  --foot: #55c98d; --bask: #ff9b5c; --ufc: #ff6b7d; --tennis: #d4d84a; --other: #9aa1b4;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-block: 20px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: .95; letter-spacing: .01em; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.sync { font-size: 12px; color: var(--ink-2); text-align: right; display: flex; align-items: center; gap: 6px; padding-bottom: 4px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); display: inline-block; }
.sync.cloud i { background: var(--ok); }
.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tot { background: var(--surface); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); min-width: 0; }
.tot b { display: block; font-family: var(--font-display); font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tot span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

.tools { display: flex; flex-direction: column; gap: 10px; }
.search { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-weight: 500; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.chip em { font-style: normal; color: var(--ink-2); font-variant-numeric: tabular-nums; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] em { color: var(--bg); opacity: .7; }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.card { background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.slab { position: relative; aspect-ratio: 5 / 7; border-radius: 8px; overflow: hidden; background: var(--surface-2); box-shadow: var(--shadow); border: 1px solid var(--line); max-width: 100%; }
.slab img { width: 100%; height: 100%; object-fit: cover; display: block; }
.slab .ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; background: linear-gradient(160deg, var(--surface-2), var(--surface)); }
.slab .ph b { font-family: var(--font-display); font-size: 26px; line-height: 1; text-transform: uppercase; overflow-wrap: anywhere; }
.slab .ph span { font-size: 12px; color: var(--ink-2); }
.tag { position: absolute; top: 8px; left: 8px; background: var(--c, var(--other)); color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; }
.grade { position: absolute; bottom: 8px; right: 8px; background: var(--ink); color: var(--bg); font-family: var(--font-display); font-weight: 700; font-size: 13px; padding: 2px 7px; border-radius: 4px; }
.card .meta { display: flex; flex-direction: column; min-width: 0; }
.card .meta b { font-weight: 600; font-size: 15px; line-height: 1.2; overflow-wrap: anywhere; }
.card .meta .price { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.card .meta span { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 14px; padding: 28px 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.empty h2 { font-family: var(--font-display); font-size: 28px; text-transform: uppercase; margin: 0; }
.empty p { margin: 0; color: var(--ink-2); max-width: 46ch; }

.fab { position: fixed; z-index: 20; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 15px 22px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .04em; text-transform: uppercase; box-shadow: 0 8px 24px rgba(43,63,217,.35); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 16px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .5; cursor: default; }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 30; background: rgba(8,10,16,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.sheet-head h2 { font-family: var(--font-display); font-size: 30px; text-transform: uppercase; margin: 0; line-height: 1; }
.x { border: 0; background: var(--surface); border-radius: 50%; width: 38px; height: 38px; font-size: 20px; line-height: 1; }
.photo { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: start; }
.photo .slab { width: 110px; }
.photo-actions { display: flex; flex-direction: column; gap: 8px; }
.hint { font-size: 13px; color: var(--ink-2); margin: 0; }
.hint.err { color: var(--danger); }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f.full { grid-column: 1 / -1; }
.f label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.f input, .f select, .f textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; width: 100%; min-width: 0; }
.f textarea { resize: vertical; min-height: 64px; }
.check { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 auto; }
.detail-img { width: min(100%, 300px); align-self: center; }
dl.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; margin: 0; }
dl.facts dt { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); padding-top: 3px; }
dl.facts dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) {
  .fab, .btn, .chip { transition: transform .12s ease; }
  .fab:active, .btn:active { transform: scale(.97); }
}

.top-r { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.top-r .btn { padding: 7px 14px; font-size: 14px; }

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>VtwinsTCG</h1>
      <div class="top-r"><div class="sync" id="sync"><i></i><span id="syncText">Chargement…</span></div><button class="btn" type="button" id="gear">Réglages</button></div>
    </div>
    <div class="totals">
      <div class="tot"><b id="tCount">0</b><span>Cartes</span></div>
      <div class="tot"><b id="tValue">0 €</b><span>Valeur totale</span></div>
      <div class="tot"><b id="tRookie">0</b><span>Rookies</span></div>
    </div>
  </header>

  <section class="tools" aria-label="Recherche et filtres">
    <input class="search" id="q" type="search" placeholder="Rechercher un joueur, un set, un numéro…" autocomplete="off">
    <div class="chips" id="chips" role="group" aria-label="Filtrer par sport"></div>
  </section>

  <main id="list"></main>
</div>

<button class="fab" id="add" type="button">+ Ajouter</button>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>


<script>

(function () {
  var SPORTS = [
    { id: 'football', label: 'Football', c: 'var(--foot)' },
    { id: 'basket', label: 'Basket', c: 'var(--bask)' },
    { id: 'ufc', label: 'UFC', c: 'var(--ufc)' },
    { id: 'tennis', label: 'Tennis', c: 'var(--tennis)' },
    { id: 'autre', label: 'Autre', c: 'var(--other)' }
  ];
  var BRANDS = ['Panini', 'Topps', 'Upper Deck', 'Donruss', 'Leaf', 'Futera', 'Autre'];
  var GRADES = ['Brut', 'PSA', 'BGS', 'SGC', 'CGC'];
  var LS_KEY = 'classeur.cards.v1';

  var cards = [];          // [{id, name, sport, year, brand, set, number, run, parallel, rookie, grader, grade, value, notes, photo, added}]
  var store = null;        // {save(card), remove(id)}
  var filter = 'all';
  var query = '';
  var $ = function (s) { return document.querySelector(s); };

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function sportOf(id) { return SPORTS.filter(function (s) { return s.id === id; })[0] || SPORTS[4]; }
  function money(n) { return (Math.round((n || 0) * 100) / 100).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' €'; }
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 2600);
  }
  function uid() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  /* ---------- storage: IndexedDB on this phone ---------- */
  var dbp = null;
  function openDb() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      var r = indexedDB.open('vtwinstcg', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('cards', { keyPath: 'id' }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn) {
    return openDb().then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction('cards', mode), out = fn(t.objectStore('cards'));
        t.oncomplete = function () { res(out ? out.result : undefined); };
        t.onerror = t.onabort = function () { rej(t.error); };
      });
    });
  }
  function getSettings() { try { return JSON.parse(localStorage.getItem('vtwins.settings')) || {}; } catch (e) { return {}; } }
  function putSettings(o) { try { localStorage.setItem('vtwins.settings', JSON.stringify(o)); } catch (e) {} }

  function setSync() { $('#syncText').textContent = 'Enregistré sur ce téléphone'; $('#sync').className = 'sync cloud'; }

  function initStore() {
    store = {
      kind: 'local',
      save: function (c) {
        var i = cards.findIndex(function (x) { return x.id === c.id; });
        if (i >= 0) cards[i] = c; else cards.unshift(c);
        return tx('readwrite', function (s) { return s.put(c); });
      },
      remove: function (id) { cards = cards.filter(function (x) { return x.id !== id; }); return tx('readwrite', function (s) { return s.delete(id); }); }
    };
    setSync(); render();
    tx('readonly', function (s) { return s.getAll(); }).then(function (all) {
      cards = (all || []).sort(function (a, b) { return (b.added || 0) - (a.added || 0); });
      render();
    }).catch(function () { toast('Stockage du téléphone indisponible.'); });
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }

  function settingsSheet() {
    var st = getSettings();
    openSheet('Réglages',
      '<div class="form">' +
      '<div class="f full"><label for="key">Clé Google AI Studio (gratuite)</label><input id="key" type="password" autocomplete="off" value="' + esc(st.key) + '" placeholder="Colle ta clé ici"></div>' +
      '<div class="f full"><label for="model">Modèle</label><input id="model" value="' + esc(st.model || 'gemini-flash-latest') + '"></div>' +
      '</div><p class="hint">La clé reste sur ce téléphone et sert uniquement à reconnaître tes cartes. Pour l’obtenir gratuitement : <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> (connexion avec un compte Google, bouton « Create API key »).</p>' +
      '<div class="row"><button class="btn primary" type="button" id="saveSet">Enregistrer</button></div>' +
      '<div class="sheet-head"><h2 style="font-size:22px">Sauvegarde</h2></div>' +
      '<p class="hint">Exporte ta collection de temps en temps pour ne rien perdre si tu changes de téléphone.</p>' +
      '<div class="row"><button class="btn" type="button" id="exp">Exporter</button>' +
      '<label class="btn" for="imp" style="text-align:center">Importer</label><input id="imp" type="file" accept="application/json,.json" hidden></div>');
    $('#saveSet').onclick = function () { putSettings({ key: $('#key').value.trim(), model: $('#model').value.trim() || 'gemini-flash-latest' }); closeSheet(); toast('Réglages enregistrés.'); };
    $('#exp').onclick = function () {
      var blob = new Blob([JSON.stringify({ app: 'VtwinsTCG', cards: cards })], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'vtwinstcg-collection.json';
      document.body.appendChild(a); a.click(); a.remove();
    };
    $('#imp').onchange = function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result), list = (d.cards || []).filter(function (c) { return c && c.id; });
          list.reduce(function (p, c) { return p.then(function () { return store.save(c); }); }, Promise.resolve())
            .then(function () { cards.sort(function (a, b) { return (b.added || 0) - (a.added || 0); }); closeSheet(); render(); toast(list.length + ' cartes importées.'); });
        } catch (err) { toast('Fichier illisible.'); }
      };
      fr.readAsText(f);
    };
  }

  /* ---------- list ---------- */
  function visible() {
    var q = query.trim().toLowerCase();
    return cards.filter(function (c) {
      if (filter !== 'all' && c.sport !== filter) return false;
      if (!q) return true;
      return [c.name, c.set, c.brand, c.year, c.number, c.parallel, c.notes].join(' ').toLowerCase().indexOf(q) >= 0;
    });
  }

  function renderChips() {
    var counts = { all: cards.length };
    cards.forEach(function (c) { counts[c.sport] = (counts[c.sport] || 0) + 1; });
    var html = [{ id: 'all', label: 'Tout' }].concat(SPORTS).map(function (s) {
      return '<button type="button" class="chip" data-f="' + s.id + '" aria-pressed="' + (filter === s.id) + '">' + esc(s.label) + ' <em>' + (counts[s.id] || 0) + '</em></button>';
    }).join('');
    $('#chips').innerHTML = html;
  }

  function slab(c) {
    var sp = sportOf(c.sport);
    var inner = c.photo
      ? '<img alt="' + esc(c.name) + '" src="' + c.photo + '">'
      : '<div class="ph"><b>' + esc(c.name || 'Sans nom') + '</b><span>' + esc([c.year, c.set].filter(Boolean).join(' · ')) + '</span></div>';
    var grade = c.grader && c.grader !== 'Brut' && c.grade ? '<span class="grade">' + esc(c.grader + ' ' + c.grade) + '</span>' : '';
    return '<div class="slab"><span class="tag" style="--c:' + sp.c + '">' + esc(sp.label) + '</span>' + inner + grade + '</div>';
  }

  function sub(c) {
    var bits = [c.year, c.brand, c.set].filter(Boolean).join(' ');
    var num = [c.number ? '#' + c.number : '', c.run ? '/' + c.run : '', c.rookie ? 'RC' : ''].filter(Boolean).join(' ');
    return [bits, num].filter(Boolean).join(' · ');
  }

  function render() {
    var total = cards.reduce(function (s, c) { return s + (Number(c.value) || 0); }, 0);
    $('#tCount').textContent = cards.length;
    $('#tValue').textContent = money(total);
    $('#tRookie').textContent = cards.filter(function (c) { return c.rookie; }).length;
    renderChips();
    var list = $('#list');
    if (!cards.length) {
      list.innerHTML = '<div class="empty"><h2>Ta collection est vide</h2><p>Prends une carte en photo : l’IA la reconnaît et estime son prix. Tu peux aussi la saisir à la main. Football, basket, UFC, tennis : tout va dans le même classeur, gratuitement.</p><button class="btn primary" type="button" data-act="add">Photographier ma première carte</button></div>';
      return;
    }
    var v = visible();
    if (!v.length) { list.innerHTML = '<div class="empty"><h2>Aucune carte trouvée</h2><p>Change le filtre ou la recherche.</p></div>'; return; }
    list.innerHTML = '<div class="grid">' + v.map(function (c) {
      return '<button type="button" class="card" data-id="' + c.id + '">' + slab(c) +
        '<div class="meta"><b>' + esc(c.name || 'Sans nom') + '</b><span>' + esc(sub(c)) + '</span>' +
        (c.value !== '' && c.value != null ? '<span class="price">' + (c.est ? '≈ ' : '') + esc(money(c.value)) + '</span>' : '') + '</div></button>';
    }).join('') + '</div>';
  }

  /* ---------- image helpers ---------- */
  function shrink(file, max, quality) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var r = Math.min(1, max / Math.max(img.width, img.height));
        var w = Math.round(img.width * r), h = Math.round(img.height * r);
        var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        cv.toBlob(function (blob) {
          if (!blob) return reject(new Error('image'));
          var fr = new FileReader();
          fr.onload = function () { resolve({ dataUrl: fr.result, blob: blob }); };
          fr.readAsDataURL(blob);
        }, 'image/jpeg', quality);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image')); };
      img.src = url;
    });
  }

  /* ---------- sheets ---------- */
  var layer = $('#layer');
  function closeSheet() { layer.innerHTML = ''; }
  function openSheet(title, body) {
    layer.innerHTML = '<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-head"><h2>' + esc(title) + '</h2><button class="x" type="button" id="close" aria-label="Fermer">×</button></div>' + body + '</div></div>';
    $('#close').onclick = closeSheet;
    $('#scrim').addEventListener('click', function (e) { if (e.target.id === 'scrim') closeSheet(); });
  }

  function opts(list, sel, key) {
    return list.map(function (o) {
      var id = key ? o.id : o, label = key ? o.label : o;
      return '<option value="' + esc(id) + '"' + (id === sel ? ' selected' : '') + '>' + esc(label) + '</option>';
    }).join('');
  }

  function formSheet(card) {
    var isNew = !card;
    var c = card || { sport: 'football', brand: 'Panini', grader: 'Brut', year: String(new Date().getFullYear()) };
    var photo = c.photo || '';
    var scanBlob = null, scanned = false, estValue = null;

    openSheet(isNew ? 'Nouvelle carte' : 'Modifier',
      '<div class="photo"><div class="slab" id="pv"></div><div class="photo-actions">' +
      '<label class="btn" for="file" style="text-align:center">Photographier ou choisir</label>' +
      '<input id="file" type="file" accept="image/*" capture="environment" hidden>' +
      '<button class="btn primary" type="button" id="scan" hidden>Reconnaître et estimer</button>' +
      '<p class="hint" id="scanHint">Prends la carte en photo : l’IA la reconnaît et estime son prix.</p></div></div>' +
      '<div class="form">' +
      '<div class="f full"><label for="name">Joueur / combattant</label><input id="name" value="' + esc(c.name) + '" placeholder="Ex. Kylian Mbappé"></div>' +
      '<div class="f"><label for="sport">Sport</label><select id="sport">' + opts(SPORTS, c.sport, true) + '</select></div>' +
      '<div class="f"><label for="year">Année / saison</label><input id="year" value="' + esc(c.year) + '" placeholder="2024"></div>' +
      '<div class="f"><label for="brand">Marque</label><select id="brand">' + opts(BRANDS, c.brand) + '</select></div>' +
      '<div class="f"><label for="set">Set</label><input id="set" value="' + esc(c.set) + '" placeholder="Prizm, Chrome…"></div>' +
      '<div class="f"><label for="number">N° de carte</label><input id="number" value="' + esc(c.number) + '" inputmode="text" placeholder="142"></div>' +
      '<div class="f"><label for="run">Tirage (/…)</label><input id="run" value="' + esc(c.run) + '" inputmode="numeric" placeholder="99"></div>' +
      '<div class="f full"><label for="parallel">Parallèle / variante</label><input id="parallel" value="' + esc(c.parallel) + '" placeholder="Silver, Gold, Refractor…"></div>' +
      '<div class="f"><label for="grader">État</label><select id="grader">' + opts(GRADES, c.grader) + '</select></div>' +
      '<div class="f"><label for="grade">Note (ex. 10)</label><input id="grade" value="' + esc(c.grade) + '" inputmode="decimal"></div>' +
      '<div class="f"><label for="value">Valeur (€)</label><input id="value" value="' + esc(c.value) + '" inputmode="decimal" placeholder="Facultatif"></div>' +
      '<div class="f"><label>&nbsp;</label><div class="check"><input id="rookie" type="checkbox"' + (c.rookie ? ' checked' : '') + '><label for="rookie" style="text-transform:none;letter-spacing:0;font-size:15px;color:inherit;font-weight:500">Rookie (RC)</label></div></div>' +
      '<div class="f full"><label for="notes">Notes</label><textarea id="notes">' + esc(c.notes) + '</textarea></div>' +
      '</div><div class="row"><button class="btn primary" type="button" id="save">Enregistrer</button></div>');

    function paintPreview() {
      var sp = sportOf($('#sport').value);
      $('#pv').innerHTML = photo ? '<img alt="Aperçu" src="' + photo + '">' :
        '<div class="ph"><b>Photo</b><span style="color:var(--ink-2);font-size:12px">' + esc(sp.label) + '</span></div>';
    }
    paintPreview();
    $('#sport').onchange = paintPreview;

    $('#scan').hidden = false;
    function b64(dataUrl) { return dataUrl.split(',')[1]; }
    function autoScan() {
      if (!getSettings().key) { $('#scanHint').textContent = 'Pour la reconnaissance automatique, ajoute ta clé gratuite dans Réglages. Tu peux aussi remplir à la main.'; return; }
      if (!scanned) runScan();
    }
    $('#file').onchange = function (e) {
      var f = e.target.files && e.target.files[0]; if (!f) return;
      shrink(f, 640, 0.72).then(function (r) {
        photo = r.dataUrl; paintPreview();
        return shrink(f, 1024, 0.8).then(function (big) { scanBlob = big.dataUrl; scanned = false; autoScan(); });
      }).catch(function () { $('#scanHint').textContent = 'Image illisible. Essaie une autre photo.'; $('#scanHint').className = 'hint err'; });
    };

    function runScan() {
      var hint = $('#scanHint'), btn = $('#scan'), st = getSettings();
      if (!scanBlob) { hint.className = 'hint'; hint.textContent = 'Choisis d’abord une photo.'; return; }
      if (!st.key) { autoScan(); return; }
      scanned = true;
      btn.disabled = true; btn.textContent = 'Analyse…'; hint.className = 'hint'; hint.textContent = 'L’IA regarde la carte et estime son prix…';
      var ask = 'Cette image est la photo d’une carte à collectionner (sport). Lis ce qui est imprimé sur la carte et réponds uniquement avec un objet JSON : ' +
        '{"name":"nom du joueur ou combattant","sport":"football|basket|ufc|tennis|autre","year":"année ou saison","brand":"Panini|Topps|Upper Deck|Donruss|Leaf|Futera|Autre","set":"nom du set","number":"numéro de carte","run":"tirage imprimé sans le slash, sinon vide","parallel":"variante ou parallèle visible, sinon vide","rookie":true ou false,"grader":"Brut|PSA|BGS|SGC|CGC (Brut si la carte n’est pas dans une capsule de gradation)","grade":"note si visible, sinon vide","price_eur":nombre ou null,"price_basis":"phrase courte : sur quoi repose l’estimation"}. ' +
        'Pour price_eur, donne la valeur de marché récente probable en euros de cette carte dans son état visible (brute si non gradée), en restant prudent. Mets null si tu ne peux pas identifier précisément la carte. Ce n’est pas un cours en direct. ' +
        'Utilise une chaîne vide pour tout ce qui n’est pas lisible. N’invente rien.';
      fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(st.model || 'gemini-flash-latest') + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': st.key },
        body: JSON.stringify({ contents: [{ parts: [{ text: ask }, { inline_data: { mime_type: 'image/jpeg', data: b64(scanBlob) } }] }], generationConfig: { responseMimeType: 'application/json', temperature: 0.2 } })
      }).then(function (r) {
        if (!r.ok) { var err = new Error('http'); err.status = r.status; throw err; }
        return r.json();
      }).then(function (j) {
        var t = j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts && j.candidates[0].content.parts[0].text;
        var d = JSON.parse(String(t).replace(/^```json|```$/g, ''));
        function put(id, v) { if (v !== undefined && v !== null && String(v).trim() !== '') $('#' + id).value = String(v).trim(); }
        put('name', d.name); put('year', d.year); put('set', d.set); put('number', d.number); put('run', d.run); put('parallel', d.parallel);
        if (d.sport && SPORTS.some(function (s) { return s.id === d.sport; })) $('#sport').value = d.sport;
        if (d.brand && BRANDS.indexOf(d.brand) >= 0) $('#brand').value = d.brand;
        if (d.rookie === true) $('#rookie').checked = true;
        if (d.grader && GRADES.indexOf(d.grader) >= 0) $('#grader').value = d.grader;
        put('grade', d.grade);
        var pr = parseFloat(d.price_eur);
        if (!isNaN(pr) && pr >= 0) {
          estValue = Math.round(pr * 100) / 100;
          $('#value').value = String(estValue).replace('.', ',');
          hint.textContent = 'Carte reconnue. Prix estimé par l’IA (' + (d.price_basis || 'estimation indicative') + '), pas un cours en direct. Corrige-le si tu connais mieux.';
        } else {
          hint.textContent = 'Carte lue, mais pas assez d’éléments pour estimer un prix. Saisis-le si tu le connais.';
        }
        paintPreview();
      }).catch(function (e) {
        hint.className = 'hint err';
        if (e && (e.status === 400 || e.status === 403)) hint.textContent = 'Clé refusée. Vérifie-la dans Réglages.';
        else if (e && e.status === 429) hint.textContent = 'Limite gratuite atteinte pour le moment. Réessaie plus tard ou remplis à la main.';
        else hint.textContent = 'Reconnaissance impossible (connexion ou réponse illisible). Remplis les champs à la main.';
      }).then(function () { btn.disabled = false; btn.textContent = 'Reconnaître et estimer'; });
    }
    $('#scan').onclick = runScan;

    $('#save').onclick = function () {
      var name = $('#name').value.trim();
      if (!name) { $('#name').focus(); toast('Indique au moins le nom du joueur.'); return; }
      var val = parseFloat(String($('#value').value).replace(',', '.'));
      var out = {
        id: c.id || uid(), added: c.added || Date.now(),
        name: name, sport: $('#sport').value, year: $('#year').value.trim(), brand: $('#brand').value,
        set: $('#set').value.trim(), number: $('#number').value.trim(), run: $('#run').value.trim().replace(/^\//, ''),
        parallel: $('#parallel').value.trim(), rookie: $('#rookie').checked, grader: $('#grader').value,
        grade: $('#grade').value.trim(), value: isNaN(val) ? '' : val, est: (!isNaN(val) && estValue !== null && val === estValue) || (c.est === true && !isNaN(val) && val === c.value), notes: $('#notes').value.trim(), photo: photo
      };
      var b = $('#save'); b.disabled = true; b.textContent = 'Enregistrement…';
      Promise.resolve(store.save(out)).then(function () {
        if (store.kind === 'local') { var i = cards.findIndex(function (x) { return x.id === out.id; }); if (i < 0) cards.unshift(out); }
        closeSheet(); render(); toast(isNew ? 'Carte ajoutée à ta collection.' : 'Carte mise à jour.');
      }).catch(function () { b.disabled = false; b.textContent = 'Enregistrer'; toast('Enregistrement impossible. Réessaie.'); });
    };
  }

  function detailSheet(id) {
    var c = cards.filter(function (x) { return x.id === id; })[0]; if (!c) return;
    var sp = sportOf(c.sport);
    var rows = [
      ['Sport', sp.label], ['Saison', c.year], ['Marque', c.brand], ['Set', c.set],
      ['N° de carte', c.number ? '#' + c.number + (c.run ? ' / ' + c.run : '') : (c.run ? '/' + c.run : '')],
      ['Variante', c.parallel], ['Rookie', c.rookie ? 'Oui (RC)' : ''],
      ['État', c.grader === 'Brut' ? 'Brut (non gradée)' : [c.grader, c.grade].filter(Boolean).join(' ')],
      ['Valeur', c.value !== '' && c.value != null ? (c.est ? '≈ ' + money(c.value) + ' (estimation IA)' : money(c.value)) : ''], ['Notes', c.notes]
    ].filter(function (r) { return r[1]; });
    openSheet(c.name || 'Carte',
      '<div class="detail-img">' + slab(c) + '</div><dl class="facts">' +
      rows.map(function (r) { return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>'; }).join('') + '</dl>' +
      '<div class="row" id="acts"><button class="btn primary" type="button" id="edit">Modifier</button><button class="btn danger" type="button" id="del">Supprimer</button></div>');
    $('#edit').onclick = function () { formSheet(c); };
    $('#del').onclick = function () {
      $('#acts').innerHTML = '<p class="hint" style="flex-basis:100%">Supprimer cette carte du classeur ? Cette action est définitive.</p>' +
        '<button class="btn danger" type="button" id="yes">Oui, supprimer</button><button class="btn" type="button" id="no">Annuler</button>';
      $('#no').onclick = function () { detailSheet(id); };
      $('#yes').onclick = function () {
        Promise.resolve(store.remove(c.id)).then(function () {
          if (store.kind === 'local') cards = cards.filter(function (x) { return x.id !== c.id; });
          closeSheet(); render(); toast('Carte supprimée.');
        }).catch(function () { toast('Suppression impossible. Réessaie.'); });
      };
    };
  }

  /* ---------- events ---------- */
  $('#add').onclick = function () { formSheet(null); };
  $('#gear').onclick = settingsSheet;
  $('#q').oninput = function (e) { query = e.target.value; render(); };
  document.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip'); if (chip) { filter = chip.getAttribute('data-f'); render(); return; }
    var card = e.target.closest('.card'); if (card) { detailSheet(card.getAttribute('data-id')); return; }
    if (e.target.closest('[data-act="add"]')) formSheet(null);
  });

  initStore();
})();

if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
</html>
